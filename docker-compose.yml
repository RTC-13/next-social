version: "3.8"

services:
  mysql:
    image: mysql:8.0
    container_name: mysql
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: mydatabase
      MYSQL_USER: user
      MYSQL_PASSWORD: password
    ports:
      - "3307:3306" # Local port 3307 maps to container port 3306
    volumes:
      - mysql_data:/var/lib/mysql

  app:
    build: .
    command: ["npm", "run", "start"] # Adjust as needed for your app's start command
    volumes:
      - .:/usr/src/app
    ports:
      - "3000:3000"
    depends_on:
      - mysql

volumes:
  mysql_data:
